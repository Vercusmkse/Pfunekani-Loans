[package]
name = "village_loans"
version = "0.1.0"
edition = "2024"
build = false # Explicitly disable the build script

[dependencies]
axum = "0.7.5" # Upgraded to 0.7.x
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.3", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower-http = { version = "0.5.2", features = ["cors", "trace"] } # Compatible with axum 0.7.x
uuid = { version = "1.23.1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower_governor = "0.1.0"
once_cell = "1.19.0"

[dev-dependencies]
# Ensure sqlx-cli version matches the sqlx version
sqlx-cli = "0.8.6"
tower = { version = "0.4", features = ["full"] }

# For integration tests, `village_loans` needs to be a dependency
[dev-dependencies.village_loans]
path = "." # Refers to the current crate
