services:
  db:
    image: postgres:16-alpine
    container_name: village_loans_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "#123Vercus"
      POSTGRES_DB: village_loans
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d village_loans"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: village_loans_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Points directly to the 'db' service name in the docker network
      - DATABASE_URL=postgres://postgres:%23123Vercus@db:5432/village_loans
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: